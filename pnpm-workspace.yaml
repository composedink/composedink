packages: [packages/*, apps/*, examples/*]
catalog:
  "typescript": "^5.9.0"
  # Vite+ requires `vite` to resolve to its own core build; pin the pair together.
  "vite-plus": "1.5.0"
  "vite": "npm:@voidzero-dev/vite-plus-core@1.5.0"
  "loro-crdt": "^1.17.0"
  "loro-codemirror": "0.3.3"
  "@module-federation/rsbuild-plugin": "~2.9.0"
  "@rsbuild/core": "^2.3.1"
  "@rsbuild/plugin-react": "^2.1.0"
  "@mdx-js/loader": "^3.0.0"
  "@module-federation/runtime": "^2.9.0"
  "react": "^19.0.0"
  "react-dom": "^19.0.0"
  "zod": "^4.0.0"
  "@codemirror/language": "^6.0.0"
  "@codemirror/state": "^6.0.0"
  "@codemirror/view": "^6.0.0"
  "@codemirror/commands": "^6.0.0"
  "@codemirror/lang-markdown": "^6.0.0"
  "@mdx-js/mdx": "^3.0.0"
  "remark-mdx": "^3.0.0"
  "unist-util-visit": "^5.0.0"
  "mdast-util-from-markdown": "^2.0.0"
  "ws": "^8.0.0"
  "@types/react": "^19.0.0"
  "@types/react-dom": "^19.0.0"
  "@types/node": "^22.0.0"
  "@types/ws": "^8.0.0"
  "@tanstack/react-start": "latest"
  "@tanstack/react-router": "latest"
  "@tanstack/router-plugin": "latest"
  "@vitejs/plugin-react": "latest"
  "@playwright/test": "latest"
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
