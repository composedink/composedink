[package]
name = "composed-rune"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Native composed desktop client drawn with rune; a peer of the studio like the web editor."
publish = false

[lib]
name = "composed_rune"
path = "src/lib.rs"

[[bin]]
name = "composed-rune"
path = "src/main.rs"

[dependencies]
# Pinned to a commit: rune is not on crates.io and its API moves on `dev`.
rune = { git = "https://github.com/anomalyco/rune", rev = "06d4f9294cb14ba976cf4421f8f99a7dfd5ce6c2" }
# Same version as the studio's `loro-crdt`, so snapshots and updates share an encoding.
loro = "=1.17.1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[features]
# Live Rust editing through rune's devserver (`scripts/rune-dev` in the rune repo).
hot = ["rune/hot"]
